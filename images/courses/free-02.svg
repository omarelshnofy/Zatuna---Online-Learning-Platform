   <text x="0" y="-45" fill="#ffffff" font-family="serif" font-size="26" text-anchor="middle">&#8748; f(x,y) dA</text>
  </g>

  <rect x="25" y="210" width="430" height="68" rx="10" fill="rgba(16, 23, 19, 0.85)" stroke="rgba(86,199,133,0.25)" stroke-width="1"/>
  <text x="45" y="238" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">MIT 18.02 Multivariable Calculus</text>
  <text x="45" y="260" fill="#a5b3a9" font-family="sans-serif" font-size="11" font-weight="bold">Prof. Denis Auroux &#183; MIT OCW</text>
