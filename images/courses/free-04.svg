<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="50%" stop-color="#164e30"/>
      <stop offset="100%" stop-color="#238653"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="300" fill="url(#bg)"/>
  <rect width="480" height="300" fill="url(#grid)"/>

  <circle cx="410" cy="50" r="130" fill="none" stroke="rgba(86,199,133,0.15)" stroke-width="2"/>
  <circle cx="410" cy="50" r="80" fill="none" stroke="rgba(86,199,133,0.08)" stroke-width="1"/>
  <circle cx="70" cy="240" r="100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <rect x="30" y="24" width="185" height="26" rx="13" fill="rgba(232,245,236,0.12)" stroke="rgba(86,199,133,0.3)" stroke-width="1"/>
  <text x="122" y="41" fill="#56c785" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5" text-anchor="middle">MIT OPENCOURSEWARE</text>

  <g transform="translate(240, 115)">
    <rect x="-80" y="-50" width="160" height="80" rx="8" fill="rgba(0,0,0,0.35)" stroke="#56c785" stroke-width="2"/>
   <text x="0" y="-12" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">A x = &#955; x</text>
   <text x="0" y="18" fill="#56c785" font-family="monospace" font-size="13" text-anchor="middle">[ det(A - &#955;I) = 0 ]</text>
  </g>

  <rect x="25" y="210" width="430" height="68" rx="10" fill="rgba(16, 23, 19, 0.85)" stroke="rgba(86,199,133,0.25)" stroke-width="1"/>
  <text x="45" y="238" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">MIT 18.06 Linear Algebra</text>
  <text x="45" y="260" fill="#a5b3a9" font-family="sans-serif" font-size="11" font-weight="bold">Prof. Gilbert Strang &#183; MIT OCW</text>
</svg>